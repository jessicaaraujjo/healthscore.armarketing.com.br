<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calculadora de Health Score</title>
<style>
:root{--bg:#f8e6ee;--card:#fff;--tx:#0c0a0b;--mu:#6a5560;--ln:#0c0a0b;--ac:#86103f;--sh:#86103f;--selbg:#0c0a0b;--seltx:#fff;--g:#14793f;--gb:#d9f2e3;--y:#8a5a00;--yb:#fbe9b5;--r:#b3202a;--rb:#f9d0d3;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c0a0b;--card:#151012;--tx:#f8eef2;--mu:#b39ba6;--ln:#c9306f;--ac:#c9306f;--sh:#c9306f;--selbg:#c9306f;--seltx:#0c0a0b;--g:#5be08f;--gb:#10281b;--y:#f2c14e;--yb:#2e2308;--r:#ff7b84;--rb:#341215;}}
:root[data-theme="dark"]{--bg:#0c0a0b;--card:#151012;--tx:#f8eef2;--mu:#b39ba6;--ln:#c9306f;--ac:#c9306f;--sh:#c9306f;--selbg:#c9306f;--seltx:#0c0a0b;--g:#5be08f;--gb:#10281b;--y:#f2c14e;--yb:#2e2308;--r:#ff7b84;--rb:#341215;}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 "Trebuchet MS","Avenir Next",system-ui,sans-serif}
.wrap{max-width:1040px;margin:0 auto;padding:22px 16px 40px}
.hd{position:relative;background:#1c030d;color:#fff;padding:24px 34px 22px 22px;border:2px solid var(--ln);box-shadow:6px 6px 0 var(--sh);margin-bottom:28px}
.hd::after{content:"";position:absolute;right:0;top:0;bottom:0;width:14px;background:#86103f}
h1{font:900 clamp(24px,5vw,38px)/1 "Arial Black","Helvetica Neue",Arial,sans-serif;text-transform:uppercase;letter-spacing:-.02em;margin:0}
h1 em{font-style:normal;color:#e0468a}.logo{display:block;height:36px;width:auto;margin-bottom:16px}
.grid{display:grid;grid-template-columns:1fr 340px;gap:22px;align-items:start}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
.card{background:var(--card);border:2px solid var(--ln);box-shadow:5px 5px 0 var(--sh);padding:16px;margin-bottom:22px}
.card h2{font:700 13px ui-monospace,Menlo,Consolas,monospace;text-transform:uppercase;letter-spacing:.08em;margin:0 0 2px;color:var(--ac)}
#crit{counter-reset:c}#crit .card h2::before{counter-increment:c;content:"0" counter(c) " / "}
.hint{color:var(--mu);font-size:13px;margin:0 0 12px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.opt{text-align:left;background:var(--card);border:2px solid var(--ln);padding:10px;color:var(--tx);font:inherit;cursor:pointer;transition:transform .08s,box-shadow .08s}
.opt:hover{transform:translate(-2px,-2px);box-shadow:3px 3px 0 var(--sh)}
.opt b{display:block;font-size:14px}.opt span{display:block;color:var(--mu);font-size:12.5px;margin-top:3px}
.opt .w{float:right;font:700 10px ui-monospace,Menlo,monospace;font-style:normal;background:var(--ac);color:#fff;padding:2px 6px;text-transform:uppercase}
.opt.on{background:var(--selbg);color:var(--seltx)}.opt.on span{color:inherit;opacity:.8}.opt.on .w{background:var(--seltx);color:var(--selbg)}
.auto label{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:2px dashed var(--mu);cursor:pointer}
.auto label:first-of-type{border-top:0}
.auto input{margin-top:3px;width:18px;height:18px;accent-color:var(--ac)}
.res{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
.flag{border:2px solid var(--ln);padding:14px 16px;margin-bottom:14px}
.flag .e{font-size:24px}.flag .n{font:900 22px "Arial Black",Arial,sans-serif;text-transform:uppercase;letter-spacing:-.01em}
.flag .sc{font:900 76px/1 "Arial Black",Arial,sans-serif;margin:4px 0}.flag .sc::after{content:" pts";font:700 14px ui-monospace,Menlo,monospace}
.flag .p{font-size:13px}
.f-g{background:var(--gb);color:var(--g)}.f-y{background:var(--yb);color:var(--y)}.f-r{background:var(--rb);color:var(--r)}.f-n{background:var(--bg);color:var(--mu)}
table{width:100%;border-collapse:collapse;font-size:14px}td{padding:5px 0;border-top:1px dashed var(--mu)}td:last-child{text-align:right;font-weight:700}tr:first-child td{border-top:0}
.tot td{font-size:16px;border-top:2px solid var(--ln)}
ul{margin:6px 0 0;padding-left:18px;font-size:13.5px}li{margin:3px 0}
.btn{width:100%;margin-top:12px;padding:10px;border:2px solid var(--ln);background:var(--ac);color:#fff;font:700 12px ui-monospace,Menlo,monospace;text-transform:uppercase;letter-spacing:.06em;cursor:pointer}
.sec{font:700 11px ui-monospace,Menlo,monospace;text-transform:uppercase;letter-spacing:.08em;color:var(--ac);margin:14px 0 4px}
</style>
</head>

<h2>Outros gatilhos de Crítico automático</h2>
<p class="hint">Os demais critérios automáticos já estão nas seleções acima. Aqui ficam só os que não têm campo próprio. Se marcado, a flag vai direto para 🔴 Crítico.</p>
<div id="autos"></div>
</div>
</div>
<div class="res">
<div class="card">
<div id="flag" class="flag f-n"></div>
<table id="calc"></table>
<div id="alerts"></div>
<button class="btn" id="reset">Limpar tudo</button>
</div>
</div>
</div>
</div>
<script>
var CR=[
{k:"rel",t:"Relacionamento",h:"Qualidade da comunicação, confiança do cliente e clima da relação.",o:[
{n:"Estável",w:1,d:"Relação cordial, confiança na equipe, conversas produtivas, sem atritos relevantes."},
{n:"Abalado",w:2,d:"Reclamações frequentes, insegurança, tom ríspido, tensão em reuniões, questionamentos recorrentes."},
{n:"Em crise",w:4,d:"Comunicação hostil, ameaça de cancelamento, ataques pessoais, desgaste constante, perda evidente de confiança.",auto:"Relacionamento em crise"}]},
{k:"res",t:"Resultado",h:"Percepção de valor, performance da operação e alinhamento com a expectativa criada.",o:[
{n:"Bom",w:1,d:"Meta atingida ou superada, cliente percebe valor, ROI visível, operação saudável."},
{n:"Mais ou menos",w:2,d:"Resultado parcial, cliente ainda percebe algum valor, performance dentro do tolerável."},
{n:"Indefinido",w:2,d:"Falta de dados ou feedback; não é possível validar a performance real."},
{n:"Ruim",w:3,d:"Abaixo da expectativa, cliente começa a questionar valor, performance preocupante."},
{n:"Péssimo",w:4,d:"Forte frustração, perda evidente de confiança, sem perspectiva clara de reversão."}]},
{k:"eng",t:"Engajamento",h:"Participação do cliente, frequência de resposta e disponibilidade para colaborar. Ajuste secundário.",o:[
{n:"Bom ou excelente",w:0,d:"Responde em até 48h, participa das reuniões e executa os combinados."},
{n:"Médio ou oscilando",w:1,d:"Participação irregular, demora para responder em alguns momentos."},
{n:"Baixo",w:2,d:"Demora muito, falta a reuniões, só responde após cobranças, não executa combinados."},
{n:"Ghosting",w:0,d:"Comunicação quase inexistente ou sem responder há mais de 14 dias; não retorna nem em assuntos críticos.",auto:"Ghosting / comunicação quase inexistente"}]},
{k:"adi",t:"Adimplência",h:"Regularidade financeira do cliente. Ajuste secundário.",o:[
{n:"Adimplente",w:0,d:"Pagamentos em dia."},
{n:"Atrasos recorrentes",w:1,d:"Atrasa com frequência; aumenta o nível de atenção."},
{n:"1 ou 2 em atraso",w:1,d:"1 ou 2 mensalidades em atraso; acompanhar de perto."},
{n:"Mais de 2 em atraso",w:0,d:"Mais de 2 mensalidades em atraso; deve ser escalado.",auto:"Mais de 2 mensalidades em atraso"}]}];
var AU=["Cliente fala em cancelar","Escalada formal de insatisfação"];
var S={rel:null,res:null,eng:null,adi:null},A=AU.map(function(){return false});
function $(i){return document.getElementById(i)}
function build(){
var h="";CR.forEach(function(c){h+='<div class="card"><h2>'+c.t+'</h2><p class="hint">'+c.h+'</p><div class="opts">';
c.o.forEach(function(o,i){h+='<button class="opt'+(S[c.k]===i?' on':'')+'" data-k="'+c.k+'" data-i="'+i+'"><b>'+o.n+'<i class="w">'+(o.auto?'crítico':'+'+o.w)+'</i></b><span>'+o.d+'</span></button>'});
h+='</div></div>'});$("crit").innerHTML=h;
var a="";AU.forEach(function(t,i){a+='<label><input type="checkbox" data-a="'+i+'"'+(A[i]?' checked':'')+'><span>'+t+'</span></label>'});$("autos").innerHTML=a}
function calc(){
var sel=function(k){return S[k]===null?null:CR[CR.findIndex(function(c){return c.k===k})].o[S[k]]};
var r=sel("rel"),s=sel("res"),e=sel("eng"),d=sel("adi"),reasons=[];
A.forEach(function(v,i){if(v)reasons.push(AU[i])});
[r,e,d].forEach(function(o){if(o&&o.auto&&reasons.indexOf(o.auto)<0)reasons.push(o.auto)});
var done=r&&s&&e&&d,init=(r?r.w:0)+(s?s.w:0),adj=(e?e.w:0)+(d?d.w:0),tot=init+adj;
var cls,em,nm,pr;
if(reasons.length){cls="f-r";em="🔴";nm="Crítico";pr="Crítico automático: escalar para liderança e acompanhar com urgência."}
else if(!done){cls="f-n";em="⚪";nm="Preencha os 4 critérios";pr=""}
else if(tot<=3){cls="f-g";em="🟢";nm="Controlado";pr="Baixa prioridade: manter fluxo normal de acompanhamento."}
else if(tot===4){cls="f-y";em="🟡";nm="Atenção";pr="Prioridade média: acompanhamento estratégico semanal. Máx. 30 dias sem evolução; depois reavaliar para Crítico."}
else if(tot>=8){cls="f-r";em="🔴";nm="Crítico";pr="Prioridade máxima: escalar para liderança e acompanhar com urgência."}
else{cls="f-r";em="🔴";nm="Crítico";pr="Prioridade alta: criar plano de ação e acompanhar de perto (semanal obrigatório)."}
$("flag").className="flag "+cls;
$("flag").innerHTML='<div class="e">'+em+'</div><div class="n">'+nm+'</div><div class="sc">'+(done?tot:"–")+'</div><div class="p">'+pr+'</div>';
$("calc").innerHTML='<tr><td>Relacionamento</td><td>'+(r?r.n+' ('+r.w+')':'—')+'</td></tr><tr><td>Resultado</td><td>'+(s?s.n+' ('+s.w+')':'—')+'</td></tr><tr><td>Score inicial</td><td>'+init+'</td></tr><tr><td>Engajamento</td><td>'+(e?e.n+' (+'+e.w+')':'—')+'</td></tr><tr><td>Adimplência</td><td>'+(d?d.n+' (+'+d.w+')':'—')+'</td></tr><tr class="tot"><td>Score final</td><td>'+tot+'</td></tr>';
var esc=[];
if(A[0])esc.push("Cliente citou cancelamento");
if(r&&r.n==="Em crise")esc.push("Relacionamento em crise");
if(e&&e.auto)esc.push("Cliente sem responder (ghosting)");
if(r&&s&&r.n==="Abalado"&&(s.n==="Ruim"||s.n==="Péssimo"))esc.push("Resultado ruim + relacionamento abalado");
if(d&&d.auto)esc.push("Inadimplência elevada");
if(A[1])esc.push("Escalada formal de insatisfação");
var h="";
if(reasons.length)h+='<div class="sec">Motivos do crítico automático</div><ul>'+reasons.map(function(x){return"<li>"+x+"</li>"}).join("")+"</ul>";
if(esc.length)h+='<div class="sec">Escalar para liderança</div><ul>'+esc.map(function(x){return"<li>"+x+"</li>"}).join("")+"</ul>";
$("alerts").innerHTML=h;
}
document.addEventListener("click",function(ev){
var b=ev.target.closest(".opt");
if(b){var k=b.dataset.k,i=+b.dataset.i;S[k]=S[k]===i?null:i;build();calc();return}
if(ev.target.id==="reset"){S={rel:null,res:null,eng:null,adi:null};A=AU.map(function(){return false});build();calc()}
});
document.addEventListener("change",function(ev){var i=ev.target.dataset.a;if(i!==undefined){A[+i]=ev.target.checked;calc()}});
build();calc();
</script>
</body>
</html>
